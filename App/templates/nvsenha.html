<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Senha</title>

    <link 
          rel="stylesheet" 
          href="./nvsenha.css">

    <link rel="shortcut icon"
          href="../imgs/capelo.png"
          type="image/x-icon">

</head>

<body>

    <!-- ==========================================================
                            LOGO DO ARCO
    =========================================================== -->

    <div>
        <img class="logo" src="../imgs/arco.png" alt="logoArco">
    </div>


    <!-- ==========================================================
                        CARD DE NOVA SENHA
    =========================================================== -->

    <div class="card">

        <div id="formulario">

            <h2>Falta pouco!</h2>

            <p>Vamos refazer sua senha</p>


            <!-- Nova senha -->

            <label for="nova">Nova senha:</label>

            <input
                type="password"
                id="nova"
                placeholder="Digite sua nova senha"
                oninput="validar()">

            <div class="msg-erro" id="erro-nova"></div>


            <!-- Confirmar senha -->

            <label for="confirma">Confirme a senha:</label>

            <input
                type="password"
                id="confirma"
                placeholder="Repita a senha"
                oninput="validar()">

            <div class="msg-erro" id="erro-confirma"></div>


            <!-- Regras da senha -->

            <div class="regras">

                <span class="regra" id="r-min">
                    <i class="ti ti-circle"></i>
                    mínimo 8 dígitos
                </span>

                <span class="regra" id="r-max">
                    <i class="ti ti-circle"></i>
                    máximo 25 dígitos
                </span>

                <span class="regra" id="r-mai">
                    <i class="ti ti-circle"></i>
                    uma letra maiúscula
                </span>

                <span class="regra" id="r-min2">
                    <i class="ti ti-circle"></i>
                    uma letra minúscula
                </span>

                <span class="regra" id="r-sim">
                    <i class="ti ti-circle"></i>
                    um símbolo (ex: #@$)
                </span>

                <span class="regra" id="r-num">
                    <i class="ti ti-circle"></i>
                    um número
                </span>

            </div>


            <!-- Botões -->

            <div class="btns">

                <button
                    class="btn-voltar"
                    onclick="voltar()">

                    Voltar

                </button>

                <button
                    class="btn-proximo"
                    id="btn-proximo"
                    onclick="avancar()"
                    disabled>

                    Próximo

                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================================
                            JAVASCRIPT
    =========================================================== -->

    <script src="./nvsenha.js"></script>

</body>

</html>
