<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCO - Configurações</title>
    <link rel="stylesheet" href="../static/css/config.css">
    <link rel="icon" href="../static/icons/capelo-A-1.png" type="image/png">

</head>

<body>

    <!-- ==================================================
                        AQUI É O CABEÇALHO
    =================================================== -->


    <!-- ==================================================
                    PÁGINA DE CONFIGURAÇÕES
    =================================================== -->

    <div class="pagina-config">

        <!-- =============================================
                MENU LATERAL DAS SEÇÕES
        ============================================== -->

        <aside class="menu-config">

            <h1 class="titulo-config">Configurações</h1>

            <button class="item-config ativo" data-secao="conta">
                <svg viewBox="0 0 24 24" class="icone-item-config" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Configurações de conta
            </button>

            <button class="item-config" data-secao="privacidade">
                <svg viewBox="0 0 24 24" class="icone-item-config" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="7" cy="15" r="4"></circle>
                    <path d="M10.5 11.5L20 2"></path>
                    <path d="M15 7l3 3"></path>
                    <path d="M18 4l3 3"></path>
                </svg>
                Privacidade
            </button>

            <button class="item-config" data-secao="sobre">
                <svg viewBox="0 0 24 24" class="icone-item-config" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z"></path>
                    <path d="M22 10v6"></path>
                    <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"></path>
                </svg>
                Sobre o ARCO
            </button>

            <button class="item-config" data-secao="dados">
                <svg viewBox="0 0 24 24" class="icone-item-config" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Atualizar dados
            </button>

            <button class="item-config" data-secao="formulario">
                <svg viewBox="0 0 24 24" class="icone-item-config" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                </svg>
                Editar modelo de formulários
            </button>

        </aside>


        <!-- =============================================
                ÁREA ONDE A SEÇÃO ESCOLHIDA APARECE
        ============================================== -->

        <main class="area-config" id="area-config">

            <!-- o conteúdo de cada seção entra aqui via fetch -->

        </main>

    </div>


    <!-- ==================================================
                        JAVASCRIPT
    =================================================== -->

    <script src="../static/js/config.js"></script>

</body>

</html>
